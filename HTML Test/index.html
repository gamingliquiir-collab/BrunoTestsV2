<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Jesus is King fo Kings</title>
    
    <style>
        body {
            background: linear-gradient(180deg, #a200ff, #17e6b9); 
            color: #cdd6f4;            
            font-family: sans-serif;
            text-align: center;

            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #00ff00;           
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        .hulk-box {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.08s ease;
            user-select: none;
        }

        .hulk-box:active {
            transform: scale(0.95);
        }

        .hulk-img {
            display: block;
            max-width: 200px; 
            border-radius: 8px;
        }

        .muetze {
            position: absolute;
            top: -5px;               
            left: 45px;               
            width: 45px !important;  
            transform: rotate(-10deg);
        }

        .eck-text {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #b3e3ff;
        }

        .sound-btn {   
            position: absolute;
            top: 20px;
            left: 25px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #00ff00;
            color: #000000;
        } 

        .volume-slider {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 150px;
            cursor: pointer;
        }

        .clicker-box {
            margin-top: 15px;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <span class="eck-text">Es sind die Juden!</span>
    <button class="sound-btn" onclick="toggleSound()">🔊 Sound an</button>
    <audio id="meinSound" src="meinSound.mp3" loop></audio>
    <audio id="animeahh" src="animeahh.mp3"></audio>

    <h1>Bruno V2</h1>

    <div class="hulk-box" onclick="addClick()" title="Klick auf Hulk!">
        <img src="hulk_PNG90.webp" class="hulk-img" alt="Hulk">
        <img src="muetze2.png" class="muetze" alt="Wintermütze">
    </div>

    <p>Die Elite wird weihnachtlich fallen!</p>

    <script>
        const anzahlFlocken = 500;

        const style = document.createElement('style');
        style.innerHTML = `
            .schneeflocke {
                position: fixed;
                top: -20px;
                color: #ffffff;
                user-select: none;
                pointer-events: none;
                z-index: 9999;
                animation: fallen linear infinite;
            }
            @keyframes fallen {
                to {
                    transform: translateY(105vh);
                }
            }
        `;
        document.head.appendChild(style);

        for (let i = 0; i < anzahlFlocken; i++) {
            const flocke = document.createElement('div');
            flocke.className = 'schneeflocke';
            flocke.innerText = '❄';
            
            flocke.style.left = Math.random() * 100 + 'vw';
            flocke.style.fontSize = (Math.random() * 12 + 10) + 'px';
            flocke.style.opacity = Math.random() * 0.7 + 0.3;
            flocke.style.animationDuration = (Math.random() * 5 + 4) + 's';
            flocke.style.animationDelay = (Math.random() * 5) + 's';
            
            document.body.appendChild(flocke);
        }

        function toggleSound() {
            const audio = document.getElementById("meinSound");
            const btn = document.querySelector(".sound-btn");

            if (audio.paused) {
                audio.play();
                btn.style.backgroundColor = "#ff0000";
                btn.innerText = "🔇 Sound aus";
            } else {
                audio.pause();
                btn.style.backgroundColor = "#00ff00";
                btn.innerText = "🔊 Sound an";
            }
        }

        function changeVolume(val) {
            const audio = document.getElementById("meinSound");
            audio.volume = val;
        }

        let clicks = 0;

        function addClick() {
            clicks++;
            document.getElementById("clickCount").innerText = clicks;

            const klickAudio = document.getElementById("animeahh");
            klickAudio.currentTime = 0;
            klickAudio.play();
        }
    </script>

    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" class="volume-slider">

    <div class="clicker-box">
        <p>Verteilte Schellen: <span id="clickCount">0</span></p>
    </div>

</body>
</html>
